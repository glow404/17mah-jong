name: 功能建议
description: 提议新功能、规则改进或工程优化
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue 和 Roadmap，确认没有重复建议。
          required: true
        - label: 我已经说明要解决的问题，而不只是给出一个实现方案。
          required: true
  - type: dropdown
    id: area
    attributes:
      label: 功能范围
      options:
        - 麻将规则或计分
        - 电脑 AI
        - 联机对战
        - 账号与安全
        - 页面与交互
        - 无障碍
        - 文档与贡献体验
        - 构建、测试或部署
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前用户或贡献者遇到的限制和使用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望行为、交互或规则，并说明验收方式。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: textarea
    id: compatibility
    attributes:
      label: 规则或兼容性影响
      description: 如果涉及日麻规则、API、数据库或已有牌局，请说明兼容性影响。
  - type: checkboxes
    id: contribution
    attributes:
      label: 参与贡献
      options:
        - label: 我愿意在维护者确认方向后提交 Pull Request。
