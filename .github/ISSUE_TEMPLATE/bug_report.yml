name: Bug 报告
description: 报告可复现的错误、规则异常或界面问题
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 17mah-jong。安全漏洞请使用 Security Advisory 私下报告，不要填写此表单。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有重复报告。
          required: true
        - label: 这不是尚未修复的安全漏洞，也不包含真实账号或会话数据。
          required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题范围
      options:
        - 麻将规则或计分
        - 电脑对战
        - 联机房间
        - 注册与登录
        - 页面与交互
        - 音乐与音效
        - 构建或部署
        - 其他
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明发生了什么，以及问题造成的影响。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供能够稳定复现问题的最小步骤、牌型或房间流程。
      placeholder: |
        1. 进入……
        2. 选择……
        3. 舍出……
        4. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 例如 Windows 11、Chrome 140、线上或本地、提交 SHA。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图、日志或牌型
      description: 请删除 Token、Cookie、邮箱和其他敏感信息后再粘贴。
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
