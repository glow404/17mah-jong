name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Run coverage tests
        run: npm run test:coverage

      - name: Verify empty D1 migrations
        run: npm run db:migrate:ci

      - name: Build production bundle
        run: npm run build

      - name: Run E2E smoke test
        run: npm run test:e2e

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Apply local migrations and run weak-network browser tests
        run: |
          npm run db:migrate:local
          npm run dev -- --host 0.0.0.0 --port 3000 > "$RUNNER_TEMP/17mah-jong-dev.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://localhost:3000/@vite/client > /dev/null; then
              E2E_BASE_URL=http://localhost:3000 npm run test:e2e:playwright
              exit $?
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/17mah-jong-dev.log"
              exit 1
            fi
            sleep 1
          done
          ps -p "$server_pid" -o pid,stat,cmd || true
          ss -ltnp || true
          curl --verbose --max-time 5 http://localhost:3000/@vite/client || true
          cat "$RUNNER_TEMP/17mah-jong-dev.log"
          exit 1

      - name: Scan repository for secrets
        if: ${{ always() }}
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
